name: Collect Cloudflare candidates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions: {}

concurrency:
  group: cf-candidate-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check parser and failure retention offline
        run: python -m unittest -v test_collector
      - name: Collect published data without candidate probes
        run: python collects.py
      - name: Save validated results
        uses: actions/upload-artifact@v4
        with:
          name: cf-candidates
          path: |
            ipv4.txt
            ipv6.txt
            candidates.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cf-candidates
          path: .
      - name: Commit generated candidate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipv4.txt ipv6.txt candidates.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Cloudflare candidate data"
          git push
